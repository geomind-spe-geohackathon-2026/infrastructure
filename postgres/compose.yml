name: swarmax-postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-swarmax}
    networks:
      swarmax: {}
    volumes:
    - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
volumes:
  data:
    name: swarmax-postgres-data
networks:
  swarmax:
    external: true
    name: swarmax
