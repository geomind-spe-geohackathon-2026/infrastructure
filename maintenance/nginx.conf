# Answers only while the real geomind.team or api.geomind.team route is gone (a deploy).
server {
    listen 80;
    server_name api.geomind.team;
    default_type application/json;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    location / {
        return 503 '{"error":{"code":"unavailable","message":"GeoMind is updating; try again in a few seconds","details":{}}}';
    }
}

server {
    listen 80 default_server;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    location = /maintenance.html { root /usr/share/nginx/html; internal; }
    location / {
        error_page 503 /maintenance.html;
        return 503;
    }
}
