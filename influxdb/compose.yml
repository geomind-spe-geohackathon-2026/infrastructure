name: swarmax-influxdb
services:
  influxdb:
    image: influxdb:2
    container_name: swarmax-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: swarmax
      DOCKER_INFLUXDB_INIT_BUCKET: swarmax
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_RETENTION: '0'
    networks:
      swarmax: {}
    volumes:
      - data:/var/lib/influxdb2
      - config:/etc/influxdb2
    healthcheck:
      test: [CMD, influx, ping, --host, http://127.0.0.1:8086]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  data:
    name: swarmax-influxdb-data
  config:
    name: swarmax-influxdb-config

networks:
  swarmax:
    external: true
    name: swarmax
