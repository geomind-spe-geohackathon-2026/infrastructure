name: swarmax-stack

x-backend: &backend
  build:
    context: ../backend
    additional_contexts:
      gemini: ../gemini
      geomind: ../geomind
  image: swarmax-backend:latest
  restart: unless-stopped
  env_file: [.env]
  environment: &backend-environment
    POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
    CELERY_BROKER_URL: redis://default:${REDIS_PASSWORD}@redis:6379/1
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    CHROMADB_URL: http://chromadb:8000
    INFLUXDB_URL: http://influxdb:8086
  networks: [stack]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    networks: [stack]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    networks: [stack]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  influxdb:
    image: influxdb:2
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_RETENTION: '0'
    networks: [stack]
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    networks: [stack]
    volumes:
      - minio:/data

  chromadb:
    image: chromadb/chroma:1.3.5
    restart: unless-stopped
    networks: [stack]
    volumes:
      - chromadb:/data

  api:
    <<: *backend
    command: [sh, -ec, 'python -m alembic upgrade head; exec python -m src.main --fastapi']
    ports:
      - ${API_PORT:-8000}:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/v1/system/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *backend
    command: [python, -m, src.main, --celery]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: [frontend]
    build: ../frontend
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-5173}:80
    depends_on:
      api:
        condition: service_healthy
    networks: [stack]

volumes:
  postgres:
  redis:
  influxdb-data:
  influxdb-config:
  minio:
  chromadb:

networks:
  stack:
