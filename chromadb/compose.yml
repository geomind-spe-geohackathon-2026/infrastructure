name: geomind-chromadb

services:
  chromadb:
    image: chromadb/chroma:1.3.5
    container_name: geomind-chromadb
    restart: unless-stopped
    networks:
      geomind: {}
    volumes:
      - data:/data
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8000']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  data:
    name: geomind-chromadb-data

networks:
  geomind:
    external: true
    name: geomind
