name: swarmax-chromadb

services:
  chromadb:
    image: chromadb/chroma:1.3.5
    container_name: swarmax-chromadb
    restart: unless-stopped
    networks:
      swarmax: {}
    volumes:
      - data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/api/v2/heartbeat]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  data:
    name: swarmax-chromadb-data

networks:
  swarmax:
    external: true
    name: swarmax
