http:
  routers:
    www-swarmax-http:
      entryPoints:
        - web
      rule: "Host(`www.geomind.team`)"
      middlewares:
        - www-to-apex
      service: noop@internal

    www-swarmax-https:
      entryPoints:
        - websecure
      rule: "Host(`www.geomind.team`)"
      middlewares:
        - www-to-apex
      service: noop@internal
      tls:
        certResolver: letsencrypt

  middlewares:
    www-to-apex:
      redirectRegex:
        regex: "^https?://www\\.geomind\\.team(.*)"
        replacement: "https://geomind.team${1}"
        permanent: true
